<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Tic-Tac-Toe</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent-x: #ff4757;
      --accent-o: #00d2d3;
      --button-bg: #3b82f6;
      --button-hover: #2563eb;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      text-align: center;
      width: 320px;
    }

    .team-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }

    .team-btn {
      padding: 6px 16px;
      background: #334155;
      border: 2px solid transparent;
      color: var(--text);
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .team-btn.selected {
      border-color: var(--button-bg);
      background: #475569;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      border-radius: 6px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button.primary-btn {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--button-bg);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.primary-btn:hover { background-color: var(--button-hover); }

    #status {
      font-size: 1.2rem;
      margin-bottom: 15px;
      font-weight: 600;
      min-height: 1.5rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      background: #334155;
      padding: 8px;
      border-radius: 12px;
    }

    .cell {
      background: var(--card-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s;
    }

    .cell:hover { background-color: #334155; }
    .cell.x { color: var(--accent-x); }
    .cell.o { color: var(--accent-o); }

    #restartBtn {
      margin-top: 25px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: #ef4444;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #restartBtn:hover { opacity: 0.9; }
    #restartBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Tic-Tac-Toe</h1>

  <div class="card">
    <p style="margin: 0 0 5px 0;">Your ID: <b id="my-id" style="color: var(--accent-o);">Connecting...</b></p>
    
    <div style="font-size: 0.9rem; margin-top: 10px;">Choose Your Symbol (Host):</div>
    <div class="team-select">
      <button class="team-btn selected" id="select-x" onclick="setTeam('X')">X</button>
      <button class="team-btn" id="select-o" onclick="setTeam('O')">O</button>
    </div>

    <input type="text" id="join-id" placeholder="Enter Friend's ID to Join">
    <button class="primary-btn" id="connect-btn">Connect & Play</button>
  </div>

  <div id="status">Waiting for connection...</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button id="restartBtn" disabled>Restart Game</button>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.querySelector('#status');
    const myIdDisplay = document.querySelector('#my-id');
    const joinInput = document.querySelector('#join-id');
    const connectBtn = document.querySelector('#connect-btn');
    const restartBtn = document.querySelector('#restartBtn');

    const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let options = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let mySymbol = "X"; 
    let conn = null;
    let running = false;

    // Team Selection for Host
    function setTeam(symbol) {
      if (conn) return; // Lock choice once connected
      mySymbol = symbol;
      document.getElementById('select-x').classList.toggle('selected', symbol === 'X');
      document.getElementById('select-o').classList.toggle('selected', symbol === 'O');
    }

    // 1. Peer Connection Initialization
    const peer = new Peer();

    peer.on('open', (id) => {
      myIdDisplay.textContent = id;
    });

    // 2. Incoming Connection (Host)
    peer.on('connection', (connection) => {
      conn = connection;
      const joinerSymbol = mySymbol === 'X' ? 'O' : 'X';
      
      // Send selected roles to Joiner
      conn.on('open', () => {
        conn.send({ type: 'init', hostSymbol: mySymbol, joinerSymbol: joinerSymbol });
        setupGame();
      });

      setupDataListener();
    });

    // 3. Outgoing Connection (Joiner)
    connectBtn.addEventListener('click', () => {
      const targetId = joinInput.value.trim();
      if (!targetId) return;

      conn = peer.connect(targetId);
      setupDataListener();
    });

    function setupGame() {
      running = true;
      restartBtn.disabled = false;
      updateStatusText();
      cells.forEach(cell => cell.addEventListener('click', cellClicked));
    }

    // 4. Data Listener for P2P Messages
    function setupDataListener() {
      conn.on('data', (data) => {
        if (data.type === 'init') {
          mySymbol = data.joinerSymbol;
          setTeam(mySymbol);
          setupGame();
        } else if (data.type === 'move') {
          updateCell(data.index, data.player);
          checkWinner();
        } else if (data.type === 'restart') {
          resetLocalBoard();
        }
      });
    }

    function cellClicked() {
      const index = this.getAttribute('data-index');

      if (options[index] !== "" || !running || currentPlayer !== mySymbol) {
        return;
      }

      updateCell(index, mySymbol);
      conn.send({ type: 'move', index: index, player: mySymbol });
      checkWinner();
    }

    function updateCell(index, player) {
      options[index] = player;
      const cell = cells[index];
      cell.textContent = player;
      cell.classList.add(player.toLowerCase());
    }

    function updateStatusText() {
      if (!running) return;
      if (currentPlayer === mySymbol) {
        statusText.textContent = `Your Turn (${mySymbol})`;
      } else {
        statusText.textContent = `Opponent's Turn (${currentPlayer})`;
      }
    }

    function checkWinner() {
      let roundWon = false;

      for (let condition of winConditions) {
        const [a, b, c] = condition;
        if (options[a] && options[a] === options[b] && options[a] === options[c]) {
          roundWon = true;
          break;
        }
      }

      if (roundWon) {
        statusText.textContent = currentPlayer === mySymbol ? "🎉 You Win!" : "❌ You Lose!";
        running = false;
      } else if (!options.includes("")) {
        statusText.textContent = "🤝 It's a Draw!";
        running = false;
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        updateStatusText();
      }
    }

    // 5. Restart Logic
    restartBtn.addEventListener('click', () => {
      resetLocalBoard();
      if (conn) {
        conn.send({ type: 'restart' });
      }
    });

    function resetLocalBoard() {
      options = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      running = true;
      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove('x', 'o');
      });
      updateStatusText();
    }
  </script>
</body>
</html>
