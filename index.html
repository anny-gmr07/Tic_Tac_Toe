<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent-x: #ff4757;
      --accent-o: #00d2d3;
      --button-bg: #3b82f6;
      --button-hover: #2563eb;
      --muted: #cbd5e1;
      --input-bg: #0f172a;
      --surface-alt: #334155;
      --surface-hover: #475569;
      --overlay: rgba(15, 23, 42, 0.9);
    }

    :root[data-theme="light"] {
      --bg: #eef2f7;
      --card-bg: #ffffff;
      --text: #172033;
      --accent-x: #dc2626;
      --accent-o: #0891b2;
      --button-bg: #2563eb;
      --button-hover: #1d4ed8;
      --muted: #526075;
      --input-bg: #f8fafc;
      --surface-alt: #dbe4f0;
      --surface-hover: #cbd5e1;
      --overlay: rgba(226, 232, 240, 0.9);
    }

    :root[data-theme="light"] .username-display { color: #000000; }

    :root[data-theme="dark"] {
      --bg: #050505;
      --card-bg: #171717;
      --text: #f5f5f5;
      --accent-x: #fb7185;
      --accent-o: #22d3ee;
      --button-bg: #404040;
      --button-hover: #525252;
      --muted: #a3a3a3;
      --input-bg: #0a0a0a;
      --surface-alt: #262626;
      --surface-hover: #404040;
      --overlay: rgba(0, 0, 0, 0.9);
    }

    :root[data-theme="orange"] {
      --bg: #21140d;
      --card-bg: #3b2114;
      --text: #fff7ed;
      --accent-x: #fb7185;
      --accent-o: #67e8f9;
      --button-bg: #ea580c;
      --button-hover: #c2410c;
      --muted: #fed7aa;
      --input-bg: #29170e;
      --surface-alt: #6b3418;
      --surface-hover: #8a431c;
      --overlay: rgba(33, 20, 13, 0.9);
    }

    :root[data-theme="lavender"] {
      --bg: #211a32;
      --card-bg: #33264d;
      --text: #faf5ff;
      --accent-x: #fb7185;
      --accent-o: #67e8f9;
      --button-bg: #8b5cf6;
      --button-hover: #7c3aed;
      --muted: #ddd6fe;
      --input-bg: #261d3a;
      --surface-alt: #4c3970;
      --surface-hover: #614b89;
      --overlay: rgba(33, 26, 50, 0.9);
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      text-align: center;
      width: 320px;
    }

    .menu-card { display: grid; gap: 12px; }

    .menu-card h2 { margin: 0 0 4px; font-size: 1.35rem; }

    .menu-card p { margin: 0 0 8px; color: var(--muted); font-size: 0.95rem; }

    .hidden { display: none !important; }

    .confirm-btn { margin-top: -2px; }

    .name-row { display: flex; gap: 8px; align-items: center; }

    .name-row input { margin: 10px 0; }

    .name-confirm-btn {
      flex: 0 0 44px;
      width: 44px !important;
      padding: 10px !important;
      font-size: 1.25rem !important;
    }

    .username-display {
      display: block;
      padding: 10px;
      color: #ffffff;
      background: var(--input-bg);
      border: 1px solid var(--surface-hover);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 700;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    #symbol-modal {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--overlay);
    }

    #invite-modal {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--overlay);
    }

    .invite-card { width: min(420px, 100%); }

    .invite-card h2 { margin-top: 0; }

    .invite-actions { display: flex; gap: 12px; }

    .invite-actions button { flex: 1; }

    .symbol-card { width: min(420px, 100%); }

    .symbol-card h2 { margin-top: 0; }

    .symbol-options { display: flex; gap: 16px; margin: 20px 0; }

    .symbol-option {
      flex: 1;
      height: 110px;
      color: var(--text);
      background: var(--surface-alt);
      border: 3px solid transparent;
      border-radius: 8px;
      font-size: 3.5rem;
      font-weight: bold;
      cursor: pointer;
    }

    .symbol-option.selected { border-color: var(--button-bg); background: var(--surface-hover); }

    .symbol-option:first-child { color: var(--accent-x); }
    .symbol-option:last-child { color: var(--accent-o); }

    #game-screen:not(.hidden) {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .secondary-btn {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--button-bg);
      border: 1px solid var(--button-bg);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .secondary-btn:hover { background: var(--button-hover); }

    #theme-picker {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--surface-hover);
      border-radius: 6px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
      font-size: 0.85rem;
    }

    #theme-picker select {
      padding: 5px 6px;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--surface-hover);
      border-radius: 4px;
    }

    .back-btn {
      margin-top: 12px;
      padding: 8px 16px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--surface-hover);
      border-radius: 6px;
      cursor: pointer;
    }

    .team-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }

    .team-btn {
      padding: 6px 16px;
      background: var(--surface-alt);
      border: 2px solid transparent;
      color: var(--text);
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .team-btn.selected {
      border-color: var(--button-bg);
      background: var(--surface-hover);
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
      border: 1px solid var(--surface-hover);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 6px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button.primary-btn {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--button-bg);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.primary-btn:hover { background-color: var(--button-hover); }

    #status {
      width: 100%;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 15px;
      font-weight: 600;
      min-height: 1.5rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      background: var(--surface-alt);
      padding: 8px;
      border-radius: 12px;
    }

    .cell {
      background: var(--card-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s;
    }

    .cell:hover { background-color: var(--surface-alt); }
    .cell.x { color: var(--accent-x); }
    .cell.o { color: var(--accent-o); }

    #restartBtn {
      margin-top: 25px;
      margin-left: auto;
      margin-right: auto;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: #ef4444;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #restartBtn:hover { opacity: 0.9; }
    #restartBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    #menuBtn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 2;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 9px;
      display: grid;
      align-content: center;
      gap: 5px;
      background: var(--card-bg);
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }

    #menuBtn span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
    }

    #menuBtn:hover { background: var(--surface-alt); }
  </style>
</head>
<body>

  <h1>Tic-Tac-Toe</h1>

  <section class="card menu-card" id="main-menu">
    <h2>Choose a game</h2>
    <button class="username-display hidden" id="username-display" type="button"></button>
    <p id="welcome-message"></p>
    <div class="name-row">
      <input type="text" id="player-name" placeholder="Your username" maxlength="20" autocomplete="nickname">
      <button class="primary-btn name-confirm-btn" id="confirm-name-btn" aria-label="Confirm username" title="Confirm username">&#10003;</button>
    </div>
    <button class="primary-btn" id="ai-mode-btn">1v1 AI 🤖</button>
    <button class="secondary-btn" id="local-mode-btn">1v1 Local 🕹️</button>
    <button class="secondary-btn" id="online-mode-btn">1v1 Online 🌐</button>
    <div id="theme-picker">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="blue">Magnificent Blue</option>
        <option value="light">Normal Light</option>
        <option value="dark">Normal Dark</option>
        <option value="orange">Attractive Orange</option>
        <option value="lavender">Gracious Lavender</option>
      </select>
    </div>
  </section>

  <section class="hidden" id="symbol-modal">
    <div class="card menu-card symbol-card">
      <h2>Choose your symbol</h2>
      <div class="symbol-options">
        <button class="symbol-option" id="select-x" type="button">X</button>
        <button class="symbol-option" id="select-o" type="button">O</button>
      </div>
    </div>
  </section>

  <section class="hidden" id="invite-modal">
    <div class="card menu-card invite-card">
      <h2>Game request</h2>
      <p><strong id="invite-username"></strong> wants to play with you.</p>
      <div class="invite-actions">
        <button class="primary-btn" id="accept-invite-btn">Accept</button>
        <button class="secondary-btn" id="decline-invite-btn">Decline</button>
      </div>
    </div>
  </section>

  <section class="card menu-card hidden" id="difficulty-menu">
    <h2>Choose difficulty</h2>
    <button class="secondary-btn difficulty-btn" data-difficulty="easy">Easy</button>
    <button class="secondary-btn difficulty-btn" data-difficulty="medium">Medium</button>
    <button class="secondary-btn difficulty-btn" data-difficulty="hard">Hard</button>
    <button class="back-btn" id="difficulty-back-btn">Back</button>
  </section>

  <main class="hidden" id="game-screen">
  <section class="card hidden" id="online-setup">
    <p style="margin: 0 0 5px 0;">Your username: <b id="my-id" style="color: var(--accent-o);">Not assigned</b></p>
    <p style="margin: 0 0 12px 0;">Friend: <b id="friend-status">Not connected</b></p>

    <label for="join-id">Friend's username</label>
    <input type="text" id="join-id" placeholder="Enter friend's username" autocomplete="off">
    <button class="primary-btn" id="connect-btn">Connect & Play</button>
  </section>

  <div id="status">Waiting for connection...</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button id="restartBtn" disabled>Restart Game</button>
  <button class="back-btn" id="menuBtn" aria-label="Open main menu" title="Open main menu">
    <span></span><span></span><span></span>
  </button>
  </main>

  <script>
    const mainMenu = document.querySelector('#main-menu');
    const difficultyMenu = document.querySelector('#difficulty-menu');
    const gameScreen = document.querySelector('#game-screen');
    const onlineSetup = document.querySelector('#online-setup');
    const playerNameInput = document.querySelector('#player-name');
    const welcomeMessage = document.querySelector('#welcome-message');
    const confirmNameBtn = document.querySelector('#confirm-name-btn');
    const usernameDisplay = document.querySelector('#username-display');
    const symbolModal = document.querySelector('#symbol-modal');
    const inviteModal = document.querySelector('#invite-modal');
    const inviteUsername = document.querySelector('#invite-username');
    const acceptInviteBtn = document.querySelector('#accept-invite-btn');
    const declineInviteBtn = document.querySelector('#decline-invite-btn');
    const menuBtn = document.querySelector('#menuBtn');
    const difficultyBackBtn = document.querySelector('#difficulty-back-btn');
    const aiModeBtn = document.querySelector('#ai-mode-btn');
    const localModeBtn = document.querySelector('#local-mode-btn');
    const onlineModeBtn = document.querySelector('#online-mode-btn');
    const themeSelect = document.querySelector('#theme-select');
    const cells = document.querySelectorAll('.cell');
    const statusText = document.querySelector('#status');
    const myIdDisplay = document.querySelector('#my-id');
    const friendStatus = document.querySelector('#friend-status');
    const joinInput = document.querySelector('#join-id');
    const connectBtn = document.querySelector('#connect-btn');
    const restartBtn = document.querySelector('#restartBtn');

    const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let options = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let mySymbol = "X"; 
    let peer = null;
    let conn = null;
    let running = false;
    let gameMode = '';
    let aiDifficulty = 'easy';
    let aiTimer = null;
    let playerName = localStorage.getItem('tttPlayerName') || '';
    let opponentName = '';
    let identityConfirmed = Boolean(playerName);
    let pendingMode = '';
    let pendingSymbol = 'X';
    let isOnlineHost = false;
    let onlineRound = 0;
    let pendingInviteName = '';
    let pendingTargetId = '';
    const savedTheme = localStorage.getItem('tttTheme') || 'blue';

    document.documentElement.dataset.theme = savedTheme;
    themeSelect.value = savedTheme;
    themeSelect.addEventListener('change', () => {
      document.documentElement.dataset.theme = themeSelect.value;
      localStorage.setItem('tttTheme', themeSelect.value);
    });

    playerNameInput.value = playerName;
    confirmNameBtn.disabled = identityConfirmed;
    [aiModeBtn, localModeBtn, onlineModeBtn].forEach(button => button.disabled = !identityConfirmed);
    if (playerName) {
      playerNameInput.classList.add('hidden');
      usernameDisplay.textContent = playerName;
      usernameDisplay.classList.remove('hidden');
      confirmNameBtn.classList.add('hidden');
      usernameDisplay.textContent = `Hi, ${playerName}`;
    }

    function showGame(mode) {
      gameMode = mode;
      mainMenu.classList.add('hidden');
      difficultyMenu.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      onlineSetup.classList.toggle('hidden', mode !== 'online');
      restartBtn.disabled = mode === 'online' && !conn;
      if (mode === 'online') onlineRound = 0;
      if (mode === 'online') {
        myIdDisplay.textContent = playerName;
        friendStatus.textContent = 'Not connected';
      }
      statusText.textContent = mode === 'online' ? `Hi ${playerName}, connect to a friend.` : '';
      resetLocalBoard();
      if (mode === 'ai' && mySymbol === 'O') {
        aiTimer = setTimeout(aiMove, 350);
      }
    }

    confirmNameBtn.addEventListener('click', () => {
      const namePattern = /^[a-zA-Z0-9_-]{3,20}$/;
      const enteredName = playerNameInput.value.trim();
      if (!namePattern.test(enteredName)) {
        welcomeMessage.textContent = 'Name must be 3-20 letters, numbers, _ or -.';
        playerNameInput.focus();
        return;
      }
      playerName = enteredName;
      localStorage.setItem('tttPlayerName', playerName);
      playerNameInput.value = playerName;
      playerNameInput.classList.add('hidden');
      usernameDisplay.textContent = `Hi ${playerName}`;
      usernameDisplay.classList.remove('hidden');
      confirmNameBtn.disabled = true;
      confirmNameBtn.classList.add('hidden');
      identityConfirmed = true;
      [aiModeBtn, localModeBtn, onlineModeBtn].forEach(button => button.disabled = false);
      welcomeMessage.textContent = '';
    });

    usernameDisplay.addEventListener('click', () => {
      playerNameInput.classList.remove('hidden');
      usernameDisplay.classList.add('hidden');
      playerNameInput.value = playerName;
      confirmNameBtn.disabled = false;
      confirmNameBtn.classList.remove('hidden');
      identityConfirmed = false;
      [aiModeBtn, localModeBtn, onlineModeBtn].forEach(button => button.disabled = true);
      playerNameInput.focus();
    });

    function showSymbolSelection(mode) {
      pendingMode = mode;
      pendingSymbol = mode === 'online-rematch' ? (mySymbol === 'X' ? 'O' : 'X') : mySymbol;
      document.querySelector('#select-x').classList.remove('selected');
      document.querySelector('#select-o').classList.remove('selected');
      symbolModal.classList.remove('hidden');
    }

    aiModeBtn.addEventListener('click', () => {
      mainMenu.classList.add('hidden');
      difficultyMenu.classList.remove('hidden');
    });

    localModeBtn.addEventListener('click', () => {
      mySymbol = 'X';
      showGame('local');
    });

    onlineModeBtn.addEventListener('click', () => showGame('online'));

    acceptInviteBtn.addEventListener('click', () => {
      inviteModal.classList.add('hidden');
      friendStatus.textContent = pendingInviteName;
      showSymbolSelection(onlineRound ? 'online-rematch' : 'online');
    });

    declineInviteBtn.addEventListener('click', () => {
      if (conn) conn.send({ type: 'invite-declined' });
      if (conn) conn.close();
      conn = null;
      isOnlineHost = false;
      pendingInviteName = '';
      inviteModal.classList.add('hidden');
      friendStatus.textContent = 'Not connected';
      statusText.textContent = 'Game request declined.';
    });

    document.querySelectorAll('.difficulty-btn').forEach(button => {
      button.addEventListener('click', () => {
        aiDifficulty = button.dataset.difficulty;
        showSymbolSelection('ai');
      });
    });

    function chooseSymbol(symbol) {
      mySymbol = pendingMode === 'online-rematch'
        ? (mySymbol === 'X' ? 'O' : 'X')
        : symbol;
      symbolModal.classList.add('hidden');
      if (pendingMode === 'online' && conn && isOnlineHost) {
        sendOnlineInit();
        setupGame();
      } else if (pendingMode === 'online-rematch' && conn && isOnlineHost) {
        onlineRound += 1;
        sendOnlineInit();
        resetLocalBoard();
      } else {
        showGame(pendingMode);
      }
    }

    document.querySelector('#select-x').addEventListener('click', () => {
      pendingSymbol = 'X';
      chooseSymbol('X');
    });

    document.querySelector('#select-o').addEventListener('click', () => {
      pendingSymbol = 'O';
      chooseSymbol('O');
    });

    difficultyBackBtn.addEventListener('click', () => {
      difficultyMenu.classList.add('hidden');
      mainMenu.classList.remove('hidden');
    });

    menuBtn.addEventListener('click', () => {
      clearTimeout(aiTimer);
      running = false;
      if (peer) peer.destroy();
      peer = null;
      conn = null;
      connectBtn.disabled = false;
      mainMenu.classList.remove('hidden');
      symbolModal.classList.add('hidden');
      inviteModal.classList.add('hidden');
      gameScreen.classList.add('hidden');
      resetLocalBoard();
    });

    function attachConnection(connection, host) {
      conn = connection;
      isOnlineHost = host;
      setupDataListener();
      conn.on('open', () => {
        connectBtn.disabled = false;
        restartBtn.disabled = false;
        if (!host) conn.send({ type: 'hello', name: playerName });
      });
      conn.on('error', () => {
        if (conn === connection) {
          conn = null;
          friendStatus.textContent = 'Not connected';
          connectBtn.disabled = false;
          restartBtn.disabled = true;
          statusText.textContent = 'Connection failed. Try again.';
        }
      });
      conn.on('close', () => {
        if (conn === connection) {
          conn = null;
          friendStatus.textContent = 'Not connected';
          restartBtn.disabled = true;
          statusText.textContent = 'Friend disconnected. You can try again.';
        }
      });
    }

    function connectToFriend(targetId) {
      if (!peer || !peer.open || conn) return;
      pendingTargetId = targetId;
      statusText.textContent = `Connecting to ${targetId}...`;
      attachConnection(peer.connect(targetId), false);
    }

    function createOnlinePeer() {
      peer = new Peer(playerName);

      peer.on('open', () => {
        connectBtn.disabled = false;
        if (pendingTargetId) connectToFriend(pendingTargetId);
        else statusText.textContent = `Ready. Share "${playerName}" with your friend.`;
      });

      peer.on('connection', connection => attachConnection(connection, true));

      peer.on('error', error => {
        connectBtn.disabled = false;
        if (error.type === 'unavailable-id') {
          peer.destroy();
          peer = null;
          statusText.textContent = 'That username is already in use. Choose another.';
        } else {
          statusText.textContent = `Connection error: ${error.type}. Try again.`;
        }
      });
    }

    // Register the username once, then reuse that peer for retries.
    connectBtn.addEventListener('click', () => {
      const targetId = joinInput.value.trim();
      connectBtn.disabled = true;
      myIdDisplay.textContent = playerName;
      pendingTargetId = targetId;
      if (!peer) createOnlinePeer();
      else if (peer.open && targetId) connectToFriend(targetId);
      else if (peer.open) {
        connectBtn.disabled = false;
        statusText.textContent = `Ready. Share "${playerName}" with your friend.`;
      }
    });

    function setupGame() {
      running = true;
      restartBtn.disabled = false;
      updateStatusText();
    }

    cells.forEach(cell => cell.addEventListener('click', cellClicked));

    // 4. Data Listener for P2P Messages
    function setupDataListener() {
      conn.on('data', (data) => {
        if (data.type === 'hello') {
          opponentName = data.name;
          pendingInviteName = opponentName;
          inviteUsername.textContent = opponentName;
          statusText.textContent = 'New game request received.';
          inviteModal.classList.remove('hidden');
        } else if (data.type === 'init') {
          mySymbol = data.joinerSymbol;
          opponentName = data.hostName;
          friendStatus.textContent = opponentName;
          isOnlineHost = false;
          resetLocalBoard();
          setupGame();
        } else if (data.type === 'move') {
          updateCell(data.index, data.player);
          checkWinner();
        } else if (data.type === 'restart') {
          resetLocalBoard();
        } else if (data.type === 'invite-declined') {
          conn = null;
          friendStatus.textContent = 'Not connected';
          statusText.textContent = 'Game request declined.';
        }
      });
    }

    function cellClicked() {
      const index = this.getAttribute('data-index');
      const player = gameMode === 'local' ? currentPlayer : mySymbol;

      if (options[index] !== "" || !running || (gameMode !== 'local' && currentPlayer !== mySymbol)) {
        return;
      }

      updateCell(index, player);
      if (gameMode === 'online' && conn) {
        conn.send({ type: 'move', index: index, player });
      }
      checkWinner();

      const aiSymbol = mySymbol === 'X' ? 'O' : 'X';
      if (gameMode === 'ai' && running && currentPlayer === aiSymbol) {
        aiTimer = setTimeout(aiMove, 350);
      }
    }

    function updateCell(index, player) {
      options[index] = player;
      const cell = cells[index];
      cell.textContent = player;
      cell.classList.add(player.toLowerCase());
    }

    function updateStatusText() {
      if (!running) return;
      if (gameMode === 'local') {
        statusText.textContent = currentPlayer === mySymbol
          ? `${playerName}'s Turn (${mySymbol})`
          : `Player 2's Turn (${currentPlayer})`;
        return;
      }
      if (currentPlayer === mySymbol) {
        statusText.textContent = `Your Turn (${mySymbol})`;
      } else {
        statusText.textContent = `Opponent's Turn (${currentPlayer})`;
      }
    }

    function checkWinner() {
      let roundWon = false;

      for (let condition of winConditions) {
        const [a, b, c] = condition;
        if (options[a] && options[a] === options[b] && options[a] === options[c]) {
          roundWon = true;
          break;
        }
      }

      if (roundWon) {
        const winner = currentPlayer === mySymbol ? playerName : (gameMode === 'ai' ? 'AI' : gameMode === 'local' ? 'Player 2' : opponentName || 'Opponent');
        statusText.textContent = `${winner} Wins🎉!`;
        running = false;
      } else if (!options.includes("")) {
        statusText.textContent = "🤝 It's a Draw!";
        running = false;
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        updateStatusText();
      }
    }

    restartBtn.addEventListener('click', () => {
      if (gameMode === 'online' && conn) {
        if (isOnlineHost) {
          showSymbolSelection('online-rematch');
        }
        return;
      }
      if (gameMode === 'ai') {
        showSymbolSelection('ai');
        return;
      }
      resetLocalBoard();
      if (conn) {
        conn.send({ type: 'restart' });
      }
    });

    function sendOnlineInit() {
      const joinerSymbol = mySymbol === 'X' ? 'O' : 'X';
      conn.send({ type: 'init', hostSymbol: mySymbol, joinerSymbol, hostName: playerName });
    }

    function resetLocalBoard() {
      options = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      running = gameMode !== 'online' || Boolean(conn);
      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove('x', 'o');
      });
      updateStatusText();
    }

    function aiMove() {
      const aiSymbol = mySymbol === 'X' ? 'O' : 'X';
      if (!running || gameMode !== 'ai' || currentPlayer !== aiSymbol) return;
      const move = chooseAiMove();
      if (move === -1) return;
      updateCell(move, aiSymbol);
      checkWinner();
    }

    function chooseAiMove() {
      const aiSymbol = mySymbol === 'X' ? 'O' : 'X';
      const humanSymbol = mySymbol;
      const available = options.map((value, index) => value === '' ? index : -1).filter(index => index !== -1);
      if (aiDifficulty === 'easy') {
        return available[Math.floor(Math.random() * available.length)];
      }

      const winningMove = findTacticalMove(aiSymbol);
      if (winningMove !== -1) return winningMove;
      const blockingMove = findTacticalMove(humanSymbol);
      if (blockingMove !== -1) return blockingMove;
      if (aiDifficulty === 'medium') {
        return available[Math.floor(Math.random() * available.length)];
      }
      return minimax(options.slice(), aiSymbol, humanSymbol).index;
    }

    function findTacticalMove(player) {
      for (const index of options.keys()) {
        if (options[index] !== '') continue;
        options[index] = player;
        const wins = hasWinner(player);
        options[index] = '';
        if (wins) return index;
      }
      return -1;
    }

    function hasWinner(player) {
      return winConditions.some(([a, b, c]) => options[a] === player && options[b] === player && options[c] === player);
    }

    function minimax(board, player, aiSymbol, humanSymbol) {
      const available = board.map((value, index) => value === '' ? index : -1).filter(index => index !== -1);
      if (winConditions.some(([a, b, c]) => board[a] === aiSymbol && board[b] === aiSymbol && board[c] === aiSymbol)) return { score: 10 };
      if (winConditions.some(([a, b, c]) => board[a] === humanSymbol && board[b] === humanSymbol && board[c] === humanSymbol)) return { score: -10 };
      if (available.length === 0) return { score: 0 };

      const moves = [];
      available.forEach(index => {
        board[index] = player;
        const result = minimax(board, player === aiSymbol ? humanSymbol : aiSymbol, aiSymbol, humanSymbol);
        moves.push({ index, score: result.score });
        board[index] = '';
      });

      return player === aiSymbol
        ? moves.reduce((best, move) => move.score > best.score ? move : best)
        : moves.reduce((best, move) => move.score < best.score ? move : best);
    }
  </script>
